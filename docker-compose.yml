services:
  postgres:
    image: postgres:16-alpine
    container_name: resto-huma-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resto}
      POSTGRES_DB: ${POSTGRES_DB:-resto_huma}
    ports:
      - "5432:5432"
    volumes:
      - resto-huma-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resto} -d ${POSTGRES_DB:-resto_huma}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  resto-huma-pgdata:
